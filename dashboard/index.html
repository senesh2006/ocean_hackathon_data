<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SplitWater data repo dashboard</title>
<meta name="description" content="Inventory, licences, coverage and map of every dataset in senesh2006/ocean_hackathon_data (snapshot 01a1d48).">
<style>*{box-sizing:border-box}
body{margin:0;font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#16181d;background:#f6f7f9}
.page{max-width:1280px;margin:0 auto;padding:28px 24px 64px}
header h1{font-size:28px;margin:0 0 6px}
.summary{color:#4a5060;margin:0 0 18px;max-width:900px}
.toc{display:flex;flex-wrap:wrap;gap:6px 14px;padding:10px 14px;background:#fff;border:1px solid #e3e6ec;border-radius:10px;margin-bottom:18px;position:sticky;top:0;z-index:5}
.toc a{color:#2f6fdb;text-decoration:none;font-size:13px}.toc a:hover{text-decoration:underline}
.section{background:#fff;border:1px solid #e3e6ec;border-radius:12px;padding:18px 20px;margin:0 0 18px;scroll-margin-top:60px}
.section .section{border:none;padding:0;margin:0}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.sec-head h2{font-size:17px;margin:0}.section .section .sec-head h2{font-size:14px;color:#4a5060}
.caption{color:#7a8090;font-size:12.5px;margin:0 0 10px}
.sec-body>*+*{margin-top:12px}
.text{margin:0;color:#4a5060}
.grid{display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));gap:16px;align-items:start}
.grid.plain{gap:12px;align-items:end}
@media(max-width:820px){.grid{grid-template-columns:1fr}}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.metric{background:#f6f7f9;border-radius:10px;padding:12px 14px}
.m-label{font-size:12px;color:#7a8090;text-transform:uppercase;letter-spacing:.04em}
.m-value{font-size:26px;font-weight:650}.m-detail{font-size:12px;color:#7a8090}
.bars{display:flex;flex-direction:column;gap:6px}
.bar-row{display:grid;grid-template-columns:minmax(120px,240px) 1fr 150px;gap:10px;align-items:center}
.bar-label{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}
.bar-track{background:#eef0f4;border-radius:4px;height:14px;overflow:hidden}
.bar-fill{background:#2f6fdb;height:100%;border-radius:4px}
.bar-val{font-variant-numeric:tabular-nums;font-size:13px}.bar-meta{color:#7a8090;margin-left:6px;font-size:12px}
.table-wrap{overflow:auto;max-height:560px;border:1px solid #e3e6ec;border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th{position:sticky;top:0;background:#f6f7f9;text-align:left;font-weight:600;padding:7px 9px;border-bottom:1px solid #e3e6ec;white-space:nowrap}
td{padding:6px 9px;border-bottom:1px solid #f0f2f5;vertical-align:top}
tr:hover td{background:#fafbfc}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px;white-space:nowrap}
.field{display:flex;flex-direction:column;gap:4px;font-size:12px;color:#4a5060}
select,input[type=search]{font:inherit;font-size:13px;padding:7px 9px;border:1px solid #cfd4dc;border-radius:8px;background:#fff;color:#16181d}
.toggle{display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer}
.toggle input{position:absolute;opacity:0}
.switch{width:34px;height:20px;border-radius:10px;background:#cfd4dc;position:relative;flex:none;transition:.15s}
.switch:after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.15s}
.toggle input:checked+.switch{background:#2f6fdb}.toggle input:checked+.switch:after{left:16px}
.btn{font:inherit;font-size:13px;padding:7px 14px;border:1px solid #cfd4dc;border-radius:8px;background:#fff;cursor:pointer;justify-self:start}
.btn:hover{background:#f6f7f9}
.seg{display:inline-flex;background:#eef0f4;border-radius:8px;padding:2px;flex-wrap:wrap}
.seg button{font:inherit;font-size:12.5px;border:none;background:none;padding:5px 11px;border-radius:6px;cursor:pointer;color:#4a5060}
.seg button.on{background:#fff;color:#16181d;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.callout{border-left:4px solid;border-radius:8px;padding:12px 14px}.callout strong{display:block;margin-bottom:4px}
.rows{display:flex;flex-direction:column}
.row-item{display:flex;justify-content:space-between;gap:16px;padding:10px 0;border-bottom:1px solid #f0f2f5;align-items:flex-start}
.row-title{font-weight:600}.row-detail{color:#4a5060;font-size:13px}
.props{display:grid;grid-template-columns:max-content 1fr;gap:6px 14px;margin:0;font-size:13px}
.props dt{color:#7a8090}.props dd{margin:0}
code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;background:#eef0f4;padding:1px 5px;border-radius:4px}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:#4a5060;margin-bottom:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
footer{color:#7a8090;font-size:12px;margin-top:24px}
svg{overflow:visible}
</style>
</head>
